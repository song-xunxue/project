      <a href="index.html">角色模拟</a> &gt; <span class="current">投资决策总结</span>
    </div>

    <h2 class="fade-in">投资决策总结</h2>

    <div class="decision-flow fade-in click-to-next" id="decisionFlow">
      <div class="decision-step">
        <span class="step-number">1</span>
        <div class="step-content">
          <h3>投资建议</h3>
          <p>在获得满意的答案之前，不建议投资。</p>
        </div>
      </div>

      <div class="decision-step">
        <span class="step-number">2</span>
        <div class="step-content">
          <h3>中试验证</h3>
          <p>要求100吨/天以上中试装置连续运行3个月的数据。</p>
        </div>
      </div>

      <div class="decision-step">
        <span class="step-number">3</span>
        <div class="step-content">
          <h3>独立验证</h3>
          <p>第三方独立验证酶回收率和五碳糖利用率。</p>
        </div>
      </div>

      <div class="decision-step">
        <span class="step-number">4</span>
        <div class="step-content">
          <h3>重算MESP</h3>
          <p>使用NREL标准假设重新计算MESP。</p>
        </div>
      </div>

      <div class="decision-step">
        <span class="step-number">5</span>
        <div class="step-content">
          <h3>供应链确认</h3>
          <p>出示已签署的秸秆长期收购协议。</p>
        </div>
      </div>

      <div class="decision-step">
        <span class="step-number">6</span>
        <div class="step-content">
          <h3>分期注资</h3>
          <p>如验证通过，考虑以里程碑式分期注资方式参与C轮。</p>
        </div>
      </div>
    </div>
